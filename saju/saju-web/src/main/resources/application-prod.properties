# ─────────────────────────────────────────────
# 배포용 설정 (Render + Neon PostgreSQL)
# Render 환경변수에 아래 값을 넣고 SPRING_PROFILES_ACTIVE=prod 로 실행한다.
#   DB_URL       예) jdbc:postgresql://ep-xxxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
#   DB_USERNAME  예) neondb_owner
#   DB_PASSWORD  Neon 에서 받은 비밀번호
# 비밀번호는 코드나 GitHub 에 절대 쓰지 않는다.
# ─────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 테이블은 처음 실행할 때 자동으로 만들어지고, 이후에는 데이터를 유지한다
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# 무료 DB 연결 수 제한에 맞춰 적게 사용
spring.datasource.hikari.maximum-pool-size=3
